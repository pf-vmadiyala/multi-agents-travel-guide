[project]
name = "multi-agents-travel-guide"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "asyncpg>=0.31.0",
    "cachetools>=7.1.4",
    "celery>=5.6.3",
    "email-validator>=2.3.0",
    "fastapi>=0.139.0",
    "geoalchemy2>=0.20.0",
    "greenlet>=3.5.3",
    "httpx>=0.28.1",
    "langchain>=1.3.12",
    "langchain-anthropic>=1.4.8",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.2.7",
    "langchain-openai>=1.3.5",
    "langgraph>=1.2.9",
    "prometheus-client>=0.25.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "redis>=8.0.1",
    "sqlalchemy>=2.0.30",
    "tenacity>=9.1.4",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["e2e: needs a running server and database"]
addopts = "-m 'not e2e'"
