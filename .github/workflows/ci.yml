# 1. Give your workflow a name displayed in the GitHub Actions UI
name: Continuous Integration & Deployment

permissions:
  id-token: write
  contents: read

# 2. Define the TRIGGERS (When should this script run?)
on:
  push:
    branches: [main] # Run when code is merged into main
  pull_request:
    branches: [main] # Run when a developer opens a Pull Request against main
  workflow_dispatch: # Allows you to manually trigger the workflow from GitHub UI

# 3. Define the JOBS (What tasks need to run?)
jobs:
  # --- JOB 1: RUN THE TEST SUITE ---
  test:
    name: Run Python Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: travel_planner
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Step A: Clone the code from your repository into the runner VM
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step B: Install Python on the runner VM
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Step C: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      # Step D: Initialize Database Schema
      - name: Initialize Database Schema
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d travel_planner -f src/db/schema.sql

      # Step E: Execute tests. If any tests fail, the workflow stops immediately!
      - name: Run Database and Cache Tests
        run: python3 -m src.db.test_db
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/travel_planner
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1

  # --- JOB 2: BUILD DOCKER IMAGES & DEPLOY (Only on merges to main) ---
  build-and-push:
    name: Build & Push Images
    needs: test # This job will ONLY start if the 'test' job completes successfully!
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' # Only run on merges to main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step A: Authenticate with AWS securely using OpenID Connect (OIDC).
      # No long-lived passwords/keys are saved. GitHub assumes a temporary role.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::186224145882:role/git-oidc
          aws-region: us-east-1

      # Step B: Log in to Amazon Elastic Container Registry (ECR)
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step C: Create a unique tag using the Git Commit SHA (first 7 characters)
      - name: Set Image Tag (Git SHA)
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # Step D: Build & Push the Uvicorn API image
      - name: Build & Push API Image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/travel-planner-api:$IMAGE_TAG -f Dockerfile.api .
          docker push ${{ steps.login-ecr.outputs.registry }}/travel-planner-api:$IMAGE_TAG

      # Step E: Build & Push the Celery Worker image
      - name: Build & Push Worker Image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/travel-planner-worker:$IMAGE_TAG -f dockerfile.worker .
          docker push ${{ steps.login-ecr.outputs.registry }}/travel-planner-worker:$IMAGE_TAG

      # Step F: Clone your separate GitOps repository to update the deployment manifests
      - name: Checkout GitOps Repo
        uses: actions/checkout@v4
        with:
          repository: aiorg/travel-planner-gitops # <-- Swap with your GitHub Org/Repo name
          token: ${{ secrets.GITOPS_REPO_PAT }} # <-- GitHub PAT Token to allow writing to the separate repo
          path: gitops-repo # Clones it into a folder named 'gitops-repo'

      # Step G: Find-and-replace the old image tags with the new Git SHA inside the GitOps YAMLs
      - name: Update Image Tags in GitOps Manifests
        run: |
          cd gitops-repo/manifests/travel-planner

          # Replace the image tag in deployment files using sed
          sed -i "s|image: .*/travel-planner-api:.*|image: ${{ steps.login-ecr.outputs.registry }}/travel-planner-api:${{ env.IMAGE_TAG }}|g" deployment.yaml
          sed -i "s|image: .*/travel-planner-worker:.*|image: ${{ steps.login-ecr.outputs.registry }}/travel-planner-worker:${{ env.IMAGE_TAG }}|g" deployment-worker.yaml

      # Step H: Commit the image tag change back to the GitOps repository.
      # ArgoCD will detect this commit and roll out the new version automatically!
      - name: Commit and Push to GitOps Repo
        run: |
          cd gitops-repo
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add manifests/travel-planner/
          git commit -m "chore: deploy travel-planner version ${{ env.IMAGE_TAG }} [skip ci]"
          git push origin main
